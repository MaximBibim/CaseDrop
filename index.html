    +'<div style="color:var(--dim);font-size:10px;letter-spacing:2px;margin-top:2px">СИМУЛЯТОР КЕЙСОВ</div>'
    +'<div style="display:flex;justify-content:center;margin:24px 0">'+crate(CASES[5],150)+'</div>'
    +'<button class="btn" onclick="go(\'cases\')">ИГРАТЬ</button>'
    +'<div class="row"><button class="btn dark" onclick="go(\'inv\')">ИНВЕНТАРЬ</button><button class="btn dark" onclick="go(\'upg\')">АПГРЕЙД</button></div>'
    +dailyBtn
    +'<div class="disc">Баланс: ◎ '+fmt(G.balance)+'<br>Начни с бесплатного кейса</div></div>';
}
function vCases(){var h="<h2>КЕЙСЫ</h2><div class=\"sub\">чем дороже кейс — тем ценнее дроп</div>",i;h+="<div class=\"ticker\">СЕЙЧАС ВЫПАЛО:";for(i=0;i<3;i++){var w=WEAPONS[Math.floor(Math.random()*WEAPONS.length)];h+="<b style=\"color:"+RAR[w[4]][0]+"\">"+w[0]+" "+w[1].slice(0,8)+"</b>"}h+="</div><div class=\"grid\">";for(i=0;i<CASES.length;i++){var c=CASES[i];h+="<div class=\"card\" onclick=\"openCaseScreen(\'"+c[0]+"\')\"><div class=\"case\">"+crate(c,78)+"</div><div class=\"cname\">"+c[1]+"</div><div class=\"csub\">"+c[2]+"</div><div class=\"price\">◎ "+fmt(c[3])+"</div></div>"}return h+"</div>"}
function findCase(id){for(var i=0;i<CASES.length;i++)if(CASES[i][0]==id)return CASES[i];return null}
function openCaseScreen(id){curCase=findCase(id);mult=1;cur="case";draw();var m=document.getElementById("main");if(m)m.scrollTop=0;SFX.click()}
function vCase(){var c=curCase,h="",i;h+='<button class="btn dark" style="width:96px;padding:9px 0;font-size:11px" onclick="go(\'cases\')">&lt; НАЗАД</button>';h+='<div style="display:flex;justify-content:center;margin:8px 0 10px">'+crate(c,150)+'</div><div style="text-align:center"><div style="font-size:22px;font-weight:900">'+c[1]+'</div><div style="color:var(--pur);font-size:10px;font-weight:700;margin-top:2px">'+c[2]+'</div><div style="color:var(--green);font-size:11px;margin-top:4px">шанс выйти в плюс: '+payback(c).toFixed(1)+'%</div></div><div class="row">';
var MM=[1,2,3,5];for(i=0;i<4;i++){h+='<div class="chip '+(mult==MM[i]?"on":"")+'" onclick="setMult('+MM[i]+')">x'+MM[i]+'</div>'}h+="</div>";var left=G.freeUntil-Date.now()/1000;if(c[0]=="free"){h+= left>0 ? '<button class="btn dark" disabled>БЕСПЛАТНО ЧЕРЕЗ '+Math.ceil(left)+' с</button>' : '<button class="btn green" onclick="doOpen()">ОТКРЫТЬ БЕСПЛАТНО</button>'}else{h+='<button class="btn" onclick="doOpen()">ОТКРЫТЬ ЗА ◎ '+fmt(c[3]*mult)+'</button>'}h+='<div class="sub" style="margin-top:12px">СОДЕРЖИМОЕ КЕЙСА</div><div class="items">';var ch=chances(c);for(i=0;i<ch.length;i++){var w=ch[i][0],rc=RAR[w[4]][0];h+='<div class="item"><div class="top" style="background:'+rc+'">'+ch[i][1].toFixed(3)+'%</div>'+svgW(w[3],rc)+'<div class="nm">'+w[0]+'</div><div class="sk">'+w[1]+'</div><div class="pr">◎ '+fmt(w[2])+'</div><div class="ch">'+RAR[w[4]][1]+'</div></div>'}return h+"</div>"}
function setMult(m){mult=m;draw();SFX.click()}
function vInv(){var h="<h2>ИНВЕНТАРЬ</h2>",i,total=0;for(i=0;i<G.inv.length;i++)total+=WEAPONS[G.inv[i][0]][2]*G.inv[i][1];h+="<div class=\"sub\">"+G.inv.length+" предметов · ◎ "+fmt(total)+"</div>";h+='<button class="btn dark" style="margin-bottom:10px" onclick="sellAll()">ПРОДАТЬ ВСЁ</button>';h+="<div class=\"inv\">";for(i=0;i<G.inv.length;i++){var w=WEAPONS[G.inv[i][0]],m=G.inv[i][1],rc=RAR[w[4]][0];h+='<div class="icard" style="border-color:'+rc+'"><div style="font-size:9px;color:'+rc+';font-weight:800">'+RAR[w[4]][1]+'</div>'+svgW(w[3],rc)+'<div class="nm">'+w[0]+'</div><div class="sk">'+w[1]+(m!=1?" ×"+m:"")+'</div><div class="pr">◎ '+fmt(w[2]*m)+'</div><button onclick="sellOne('+i+')">ПРОДАТЬ ЗА '+fmt(w[2]*m)+'</button></div>'}return h+"</div>"}
function sellOne(i){if(i<0||i>=G.inv.length)return;var w=WEAPONS[G.inv[i][0]];G.balance+=w[2]*G.inv[i][1];G.inv.splice(i,1);if(upItem!=null&&upItem>=G.inv.length)upItem=null;SFX.cash();save();draw()}
function sellAll(){var i,t=0;for(i=0;i<G.inv.length;i++)t+=WEAPONS[G.inv[i][0]][2]*G.inv[i][1];G.balance+=t;G.inv=[];upItem=null;SFX.cash();save();draw();toast("Продано за ◎ "+fmt(t))}
function vUpg(){var p={1.5:0.75,2:0.5,5:0.2,10:0.1}[upMult],h="",i;h+="<h2>АПГРЕЙД</h2><div class=\"sub\">рискуй предметом ради множителя</div>";h+='<div class="gauge"><div class="ring" style="--deg:'+(p*360)+'deg"></div><div class="inner"><div class="pct">'+Math.round(p*100)+'%</div><div class="lab">ШАНС УСПЕХА</div></div><div class="needle" id="needle"></div></div>';
if(upItem!=null&&G.inv[upItem]){var w=WEAPONS[G.inv[upItem][0]],m=G.inv[upItem][1],rc=RAR[w[4]][0];h+='<div class="icard" style="border-color:'+rc+'"><div style="font-size:9px;color:'+rc+';font-weight:800">СТАВКА</div>'+svgW(w[3],rc)+'<div class="nm">'+w[0]+'</div><div class="pr">сейчас ◎ '+fmt(w[2]*m)+'</div><div class="sk">станет ◎ '+fmt(w[2]*m*upMult)+' (x'+upMult+')</div></div>'}else{h+='<div class="stat"><span>Выбери предмет в инвентаре ниже</span></div>'}
h+="<div class=\"row\">";var mm=[[1.5,"#4ade80",75],[2,"#38bdf8",50],[5,"#a855f7",20],[10,"#fbbf24",10]];for(i=0;i<mm.length;i++){h+='<div class="chip '+(Math.abs(upMult-mm[i][0])<1e-6?"on":"")+'" onclick="setUpMult('+mm[i][0]+')" style="flex-direction:column"><div>x'+mm[i][0]+'</div><div style="font-size:8px;color:var(--dim)">'+mm[i][2]+'%</div></div>'}h+="</div>";h+='<button class="btn green" onclick="doUpgrade()">АПГРЕЙДИТЬ ('+Math.round(p*100)+'%)</button><div class="sub" style="margin-top:12px">ИНВЕНТАРЬ</div><div class="items">';for(i=0;i<G.inv.length&&i<12;i++){var w2=WEAPONS[G.inv[i][0]],rc2=RAR[w2[4]][0];h+='<div class="item" style="border-color:'+(upItem==i?"#4ade80":rc2)+'" onclick="pickUp('+i+')">'+svgW(w2[3],rc2)+'<div class="nm">'+w2[0]+'</div><div class="pr">◎ '+fmt(w2[2]*G.inv[i][1])+'</div></div>'}h+="</div>";if(!G.inv.length)h+='<div class="disc">Инвентарь пуст</div>';return h}
function setUpMult(m){upMult=m;draw();SFX.click()}function pickUp(i){upItem=i;draw();SFX.click()}
function vProfile(){var s=G,h="",i;h+="<h2>ПРОФИЛЬ</h2>";h+='<div class="icard" style="align-items:flex-start;margin-bottom:10px"><div style="font-size:18px;font-weight:900;color:var(--pur)">УРОВЕНЬ '+s.level+'</div><div class="bar" style="width:100%"><div style="width:'+(s.xp%100)+'%"></div></div><div class="sk">XP '+(s.xp%100)+' / 100</div></div>';var rows=[["Открыто кейсов",s.opened],["Потрачено","◎ "+fmt(s.spent)],["Получено","◎ "+fmt(s.earned)],["Лучший дроп","◎ "+fmt(s.best)],["Прибыль","◎ "+fmt(s.earned-s.spent)]];for(i=0;i<rows.length;i++)h+='<div class="stat"><span>'+rows[i][0]+'</span><b>'+rows[i][1]+'</b></div>';
h+="<div class=\"sub\" style=\"margin-top:12px\">КВЕСТЫ</div>";var qs=[["Открыть 10 кейсов",Math.min(10,s.q1),10,s.q1d],["Выбить скин дороже 10K",s.best>=10000?1:0,1,s.q2d]];for(i=0;i<qs.length;i++){var q=qs[i];h+='<div class="stat" style="flex-direction:column;align-items:stretch"><div style="display:flex;justify-content:space-between"><span>'+q[0]+'</span><b style="color:'+(q[3]?"var(--green)":"var(--dim)")+'">'+(q[3]?"ГОТОВО":q[1]+" / "+q[2])+'</b></div><div class="bar"><div style="width:'+(q[1]/q[2]*100)+'%"></div></div></div>'}return h}
function toast(t){var d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},1700)}
function daily(){if(Date.now()/1000-G.dailyTs<86400){SFX.lose();return}G.balance+=300;G.dailyTs=Date.now()/1000;SFX.bonus();save();draw();toast("БОНУС +300")}
function doOpen(){var c=curCase,cost=c[3]*mult;if(c[0]=="free"&&Date.now()/1000<G.freeUntil){SFX.lose();toast("Бесплатный кейс ещё не готов");return}if(G.balance<cost){SFX.lose();toast("Недостаточно средств");return}G.balance-=cost;if(c[0]=="free")G.freeUntil=Date.now()/1000+300;var wins=[],i;for(i=0;i<mult;i++)wins.push(rollIdx(c));var gained=0,best=0;for(i=0;i<wins.length;i++){var pr=WEAPONS[wins[i]][2];gained+=pr;if(pr>best)best=pr}G.opened+=mult;G.spent+=cost;G.earned+=gained;if(best>G.best)G.best=best;G.xp+=Math.floor(cost/50);var ol=G.level;G.level=1+Math.floor(G.xp/100);G.q1+=mult;var msg=null;if(G.level>ol){SFX.level();msg="НОВЫЙ УРОВЕНЬ: "+G.level}if(G.q1>=10&&!G.q1d){G.q1d=true;G.balance+=1000;SFX.bonus();msg="КВЕСТ: 10 кейсов! +1000"}if(G.best>=10000&&!G.q2d){G.q2d=true;G.balance+=2500;SFX.bonus();msg="КВЕСТ: дроп >10K! +2500"}save();if(msg)toast(msg);spin(wins,c)}
function cardHTML(wi){var w=WEAPONS[wi],rc=RAR[w[4]][0];return '<div class="sc"><div class="bar" style="background:'+rc+'"></div>'+svgW(w[3],rc)+'<div style="font-size:10px;font-weight:800">'+w[0]+'</div><div style="font-size:7px;color:var(--dim)">'+w[1]+'</div><div style="font-size:10px;font-weight:800;color:var(--gold)">◎ '+fmt(w[2])+'</div></div>'}
function spin(wins,c){var ov=document.createElement("div");ov.className="ov";var strip=[],i;for(i=0;i<90;i++)strip.push(Math.floor(Math.random()*WEAPONS.length));var target=76;for(i=0;i<wins.length;i++)strip[target+i]=wins[i];var h='<div style="font-size:15px;font-weight:900;margin-bottom:10px">'+c[1].toUpperCase()+'</div><div class="sw"><div class="strip" id="st">';for(i=0;i<strip.length;i++)h+=cardHTML(strip[i]);h+='</div><div class="ptr"></div><div class="flash" id="fl"></div></div>';ov.innerHTML=h;document.body.appendChild(ov);var st=document.getElementById("st"),CW=126,t0=Date.now(),dur=3400,lastTick=-1,fin=false;function frame(){var el=Date.now()-t0,p=Math.min(1,el/dur),e=1-Math.pow(1-p,3),off=e*target*CW;st.style.transform="translateX(-"+off+"px)";var tick=Math.floor(off/CW);if(tick!=lastTick){lastTick=tick;if(p<0.97)SFX.tick()}if(p<1&&!fin){requestAnimationFrame(frame)}else if(!fin){fin=true;document.getElementById("fl").classList.add("on");SFX.win();setTimeout(function(){showResult(ov,wins,c)},600)}}requestAnimationFrame(frame);SFX.open()}
function showResult(ov,wins,c){var h='<div style="font-size:20px;font-weight:900;color:var(--green);margin-bottom:10px">ВЫПАЛО!</div>',i,total=0;for(i=0;i<wins.length;i++)total+=WEAPONS[wins[i]][2];for(i=0;i<Math.min(4,wins.length);i++){var w=WEAPONS[wins[i]],rc=RAR[w[4]][0];h+='<div class="icard" style="width:100%;max-width:420px;flex-direction:row;justify-content:space-between;margin-bottom:8px;border-color:'+rc+'">'+svgW(w[3],rc)+'<div style="flex:1;padding:0 10px"><div style="font-size:11px;font-weight:800">'+w[0]+' | '+w[1]+'</div><div style="font-size:8px;color:'+rc+'">'+RAR[w[4]][1]+'</div></div><div style="color:var(--gold);font-weight:800">◎ '+fmt(w[2])+'</div></div>'}h+='<div style="font-weight:900;color:var(--gold);margin:8px 0">Итого: ◎ '+fmt(total)+'</div><button class="btn" style="max-width:420px" onclick="claimSpin(this)">ЗАБРАТЬ</button>';ov.innerHTML=h;ov.dataset.wins=JSON.stringify(wins)}
function claimSpin(btn){var ov=btn.closest(".ov");var wins=JSON.parse(ov.dataset.wins),i;for(i=0;i<wins.length;i++)G.inv.push([wins[i],1]);SFX.cash();save();ov.remove();go("inv")}
draw();
</script>

if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
